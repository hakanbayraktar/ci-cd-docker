stages:
  - test
  - build
  - deploy

variables:
  IMAGE_NAME: "$DOCKER_USERNAME/devops-app"
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

test:
  stage: test
  image: node:24-alpine
  script:
    - npm ci
    - npm test

build-and-push:
  stage: build
  image: docker:27-cli
  services:
    - name: docker:27-dind
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKER_USERNAME" --password-stdin
    - docker build --tag "$IMAGE_NAME:$CI_COMMIT_SHA" --tag "$IMAGE_NAME:latest" .
    - docker push "$IMAGE_NAME:$CI_COMMIT_SHA"
    - docker push "$IMAGE_NAME:latest"

deploy-to-ubuntu:
  stage: deploy
  image: alpine:3.20
  needs: [build-and-push]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apk add --no-cache openssh-client
    - install -m 700 -d ~/.ssh
    - cp "$SSH_PRIVATE_KEY" ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts
  script:
    - |
      printf '%s' "$DOCKERHUB_TOKEN" | ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes "$SSH_USER@$SERVER_IP" \
        "docker login --username '$DOCKER_USERNAME' --password-stdin && \
         docker pull $IMAGE_NAME:$CI_COMMIT_SHA && \
         docker logout && \
         (docker rm -f cicd-pipeline-container || true) && \
         docker run -d --restart unless-stopped --name cicd-pipeline-container \
           -p 8080:8080 $IMAGE_NAME:$CI_COMMIT_SHA"
